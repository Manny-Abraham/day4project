<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE results-ui — throwaway, do not ship</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:system-ui}</style>
</head>
<body class="bg-neutral-100 text-neutral-900">
<div class="max-w-5xl mx-auto p-4">
<p class="text-xs font-mono bg-yellow-200 inline-block px-2 py-1 rounded">PROTOTYPE throwaway — results UI variants A/B/C</p>
<h1 class="text-xl font-bold mt-2">Emotion → Movies (stub)</h1>

<!-- input row stub -->
<div class="mt-3 bg-white rounded p-3 shadow flex flex-wrap gap-2 items-center">
<input id="cur" class="border rounded px-2 py-1 w-64" placeholder="Current feeling (optional)" value="Stressed after work">
<div class="flex gap-1" id="chips"></div>
<button class="bg-black text-white rounded px-3 py-1" onclick="run()">Recommend</button>
<span id="degraded" class="hidden text-xs bg-orange-200 px-2 py-1 rounded">degraded fallback</span>
</div>
<p class="text-xs mt-1">Desired: <b id="des">Relaxed (Tired/Relaxed)</b> · quiz stub → desired · voice phased out</p>

<!-- variants -->
<div id="vA" class="variant">
<h2 class="font-bold mt-4">A · Grid cards</h2>
<div id="gridA" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 mt-2"></div>
</div>
<div id="vB" class="variant hidden">
<h2 class="font-bold mt-4">B · Horizontal rail</h2>
<div id="railB" class="flex gap-3 overflow-x-auto mt-2 pb-2"></div>
</div>
<div id="vC" class="variant hidden">
<h2 class="font-bold mt-4">C · Why-match first list</h2>
<div id="listC" class="flex flex-col gap-2 mt-2"></div>
</div>

<!-- empty state stub -->
<div class="mt-4 bg-white rounded p-3 shadow">
<h3 class="font-bold">Empty state (stub)</h3>
<p class="text-sm">No tight matches for Relaxed ≥ 7.0. <button class="underline" onclick="loosen()">Loosen to 6.5 + retry</button></p>
<p id="loosenMsg" class="text-xs text-green-700"></p>
</div>

<!-- state dump -->
<pre id="state" class="text-xs bg-black text-green-200 p-2 rounded mt-4"></pre>
</div>

<!-- variant switch bar -->
<div class="fixed bottom-3 left-1/2 -translate-x-1/2 bg-black text-white rounded-full px-2 py-1 flex gap-1 text-sm">
<button class="px-3 py-1 rounded-full" onclick="setV('A')">A grid</button>
<button class="px-3 py-1 rounded-full" onclick="setV('B')">B rail</button>
<button class="px-3 py-1 rounded-full" onclick="setV('C')">C list</button>
</div>

<script>
const MOVIES=[
{t:"Amélie",y:2001,g:"Comedy/Romance",r:8.3,im:"8.3",rt:"89%",why:"Gentle whimsy Stressed → Relaxed, no stakes.",yt:"dQw4w9WgXcQ"},
{t:"Paddington 2",y:2017,g:"Family/Comedy",r:8.2,im:"7.8",rt:"99%",why:"Warm kindness, soft landing to Relaxed.",yt:"dQw4w9WgXcQ"},
{t:"My Neighbor Totoro",y:1988,g:"Animation/Family",r:8.2,im:"8.2",rt:"94%",why:"Slow forest calm, breathes out stress.",yt:"dQw4w9WgXcQ"},
{t:"The Grand Budapest Hotel",y:2014,g:"Comedy/Drama",r:8.1,im:"8.1",rt:"92%",why:"Playful order, cozy distance from day.",yt:"dQw4w9WgXcQ"},
{t:"Sing Street",y:2016,g:"Drama/Music",r:7.9,im:"7.9",rt:"95%",why:"Hopeful lift without loud thrills.",yt:"dQw4w9WgXcQ"}];
const chips=["Happy","Sad","Stressed","Angry","Bored","Lonely","Excited","Tired/Relaxed"];
chips.forEach(c=>{const b=document.createElement("button");b.textContent=c;b.className="border rounded-full px-2 py-0.5 text-xs"+(c==="Tired/Relaxed"?" bg-black text-white":"");b.onclick=()=>{document.getElementById("des").textContent=c;dump({desired:c})};document.getElementById("chips").appendChild(b)});
function card(m,i){return `<div class="bg-white rounded shadow p-2 w-64 shrink-0"><div class="h-28 bg-gradient-to-br from-indigo-200 to-pink-200 rounded flex items-center justify-center text-xs">poster ${i+1}</div><p class="font-bold mt-1">${m.t} <span class="font-normal">(${m.y})</span></p><p class="text-xs">${m.g} · ★ ${m.r} · IMDb ${m.im} · RT ${m.rt}</p><p class="text-xs mt-1 italic">“${m.why}”</p><a class="text-xs underline" href="https://www.youtube.com/watch?v=${m.yt}" target="_blank">Trailer ↗</a></div>`}
function cardC(m,i){return `<div class="bg-white rounded shadow p-2"><p class="text-xs italic">“${m.why}”</p><p class="font-bold">${i+1}. ${m.t} (${m.y}) <span class="text-xs font-normal">${m.g} · ★ ${m.r}</span> <a class="text-xs underline" href="https://www.youtube.com/watch?v=${m.yt}" target="_blank">Trailer ↗</a></p></div>`}
document.getElementById("gridA").innerHTML=MOVIES.map(card).join("");
document.getElementById("railB").innerHTML=MOVIES.map(card).join("");
document.getElementById("listC").innerHTML=MOVIES.map(cardC).join("");
function setV(v){["A","B","C"].forEach(x=>document.getElementById("v"+x).classList.toggle("hidden",x!==v));const u=new URL(location.href);u.searchParams.set("variant",v);history.replaceState(null,"",u);dump({variant:v})}
function run(){dump({action:"recommend",current:document.getElementById("cur").value,desired:document.getElementById("des").textContent,count:5})}
function loosen(){document.getElementById("loosenMsg").textContent="Loosened to 6.5 — 3 more candidates (stub).";dump({action:"loosen",minRating:6.5})}
function dump(s){document.getElementById("state").textContent="state "+JSON.stringify(s)}
setV(new URL(location.href).searchParams.get("variant")||"A");
</script>
</body>
</html>
